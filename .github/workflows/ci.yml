name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  worker:
    name: Python worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        run: pip install -r worker/requirements.txt

      - name: Check the worker compiles
        run: python -m py_compile worker/worker.py

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/health
          id=$(curl -fsS -X POST http://localhost:8080/jobs \
            -H 'Content-Type: application/json' \
            -d '{"type":"word_count","payload":{"text":"ci smoke test"}}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 20); do
            status=$(curl -fsS http://localhost:8080/jobs/$id \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "job $id: $status"
            if [ "$status" = "succeeded" ]; then exit 0; fi
            sleep 1
          done
          echo "job did not succeed in time"
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v