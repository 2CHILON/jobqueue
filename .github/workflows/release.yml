name: Release

on:
  push:
    tags: ["v*"]

# Creating a release and uploading assets needs write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build binaries
        run: |
          mkdir -p build dist
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" -o build/jobqueue-server.exe ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$LDFLAGS" -o build/jobqueue-server ./cmd/server

      - name: Package assets
        run: |
          zip -j dist/jobqueue-server_windows_amd64.zip build/jobqueue-server.exe
          tar -C build -czf dist/jobqueue-server_linux_amd64.tar.gz jobqueue-server
          zip -j dist/jobqueue-worker.zip worker/worker.py worker/requirements.txt
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Save Windows binary for the installer job
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: build/jobqueue-server.exe
          retention-days: 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE

  windows-installer:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: build

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:GITHUB_REF_NAME" installer\jobqueue.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum and upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = "installer\output\jobqueue-setup_$env:GITHUB_REF_NAME.exe"
          $name = Split-Path $file -Leaf
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$file.sha256" -Value "$hash  $name" -Encoding ascii
          gh release upload "$env:GITHUB_REF_NAME" $file "$file.sha256"

  docker-images:
    name: Docker image (${{ matrix.name }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: .
            build_args: VERSION=${{ github.ref_name }}
          - name: worker
            context: ./worker
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}